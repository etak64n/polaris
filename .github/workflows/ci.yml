# Type-checks, tests, and builds polaris on every push to main, every pull request, and
# every release (release.yml calls this workflow before it publishes).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version that "packageManager" in package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI has no deployment of its own, so it checks the code with the example settings.
      - name: Use the example settings
        run: cp polaris.config.example.ts polaris.config.ts

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build
        run: pnpm exec cf build
