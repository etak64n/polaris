# Type-checks, tests, and builds polestar on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CI has no deployment of its own, so it checks the code with the example settings.
      - name: Use the example settings
        run: cp polestar.config.example.ts polestar.config.ts

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npx cf build
