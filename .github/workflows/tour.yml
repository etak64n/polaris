# Records the tour of the demo that the README shows at its top, from the demo on GitHub
# Pages: the Free plan limits with a help frame, the cost, and the dashboard of Workers.
# Run it by hand after the screens change, then put the artifact at images/tour.gif.
name: Tour

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright, Chromium, and ffmpeg
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      # The recording has no mouse pointer, so the page draws one where the mouse moves.
      - name: Record the tour
        env:
          DEMO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          cat > tour.mjs <<'SCRIPT'
          import { chromium } from "playwright";

          const size = { width: 1440, height: 900 };
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: size, recordVideo: { dir: "video", size } });
          await context.addInitScript(() => {
            addEventListener("DOMContentLoaded", () => {
              const pointer = document.createElement("div");
              pointer.style.cssText = "position:fixed;left:0;top:0;z-index:2147483647;pointer-events:none;transform:translate(-50px,-50px)";
              pointer.innerHTML =
                '<svg width="20" height="22" viewBox="0 0 20 22"><path d="M2 1v16l4.5-4.2 3 7 2.6-1.1-3-6.9H15z" fill="#1a2c44" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
              document.body.append(pointer);
              addEventListener("mousemove", (event) => {
                pointer.style.transform = `translate(${event.clientX - 2}px, ${event.clientY - 1}px)`;
              }, true);
            });
          });
          const page = await context.newPage();
          const pause = (ms) => page.waitForTimeout(ms);
          const pointAt = async (locator, steps = 30) => {
            const box = await locator.boundingBox();
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2, { steps });
          };
          const scrollTo = async (locator) => {
            await locator.evaluate((element) => element.scrollIntoView({ behavior: "smooth", block: "start" }));
            await pause(1400);
          };

          await page.goto(process.env.DEMO_URL);
          await page.getByRole("heading", { name: "Free plan limits" }).waitFor();
          await page.mouse.move(760, 520);
          await pause(1800);
          await pointAt(page.getByRole("button", { name: "About Left" }).first());
          await pause(2600);
          await page.mouse.move(760, 640, { steps: 15 });
          await scrollTo(page.getByRole("heading", { name: "Cost" }));
          await pointAt(page.getByRole("button", { name: "About Projected" }));
          await pause(2600);
          await page.mouse.move(760, 640, { steps: 15 });
          await pause(800);

          const workers = page.getByRole("link", { name: "Workers", exact: true });
          await pointAt(workers);
          await workers.click();
          await page.getByRole("heading", { name: "CPU time by handler" }).waitFor();
          await pause(2200);
          const chart = page.locator("article", { has: page.getByRole("heading", { name: "Requests", exact: true }) }).locator("canvas").first();
          const box = await chart.boundingBox();
          await page.mouse.move(box.x + box.width * 0.15, box.y + box.height * 0.5, { steps: 20 });
          await page.mouse.move(box.x + box.width * 0.8, box.y + box.height * 0.5, { steps: 60 });
          await pause(1200);
          await page.mouse.move(1380, 450, { steps: 15 });
          await scrollTo(page.getByRole("heading", { name: "CPU time by handler" }));
          await pause(3000);

          await context.close();
          await browser.close();
          SCRIPT
          node tour.mjs

      # A palette made from the frames keeps the colors of the screens, and drawing only what
      # changes between frames keeps the file small.
      - name: Make the GIF
        run: >-
          ffmpeg -y -i video/*.webm
          -vf "fps=10,scale=1200:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle"
          tour.gif

      - uses: actions/upload-artifact@v5
        with:
          name: tour
          path: tour.gif
          if-no-files-found: error
