# Takes the screenshot of the overview that the README shows, from the demo on GitHub
# Pages, and keeps it as the artifact of the run. Run it by hand after the overview
# changes, then put the artifact at images/overview.png.
name: Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.65.0 install --with-deps chromium

      # A desktop window at twice the density of pixels, so that the text stays sharp on
      # high-density screens. The wait lets the demo compute its sample data.
      - name: Take the screenshot of the overview
        run: >-
          npx --yes playwright@1.65.0 screenshot
          --device "Desktop Chrome HiDPI"
          --viewport-size "1440,900"
          --wait-for-timeout 3000
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          overview.png

      - uses: actions/upload-artifact@v5
        with:
          name: overview
          path: overview.png
          if-no-files-found: error
