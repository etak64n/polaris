<text x="112" y="214" font-size="15" fill="#1a2c44" font-weight="600" text-anchor="middle">Browser</text>
<text x="112" y="234" font-size="12" fill="#3c4f69" text-anchor="middle">the people you allow</text>
<rect x="240" y="140" width="178" height="124" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(317 156) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="329" y="206" font-size="15" fill="#1a2c44" font-weight="600" text-anchor="middle">Cloudflare Access</text>
<text x="329" y="228" font-size="12" fill="#3c4f69" text-anchor="middle">sign-in on your domain,</text>
<text x="329" y="245" font-size="12" fill="#3c4f69" text-anchor="middle">only for the allowed emails</text>
<rect x="450" y="80" width="300" height="234" rx="12" fill="#ffffff" stroke="#533afd" stroke-width="1.5"/>
<g transform="translate(466 94) scale(0.8125)"><rect width="32" height="32" rx="7" fill="#18181b"/><path d="M16 4.5 18.6 13.4 27.5 16 18.6 18.6 16 27.5 13.4 18.6 4.5 16 13.4 13.4Z" fill="#ffffff"/></g>
<text x="502" y="106" font-size="15" fill="#1a2c44" font-weight="700">polaris Worker</text>
<text x="502" y="124" font-size="12" fill="#3c4f69">on your custom domain</text>
<rect x="466" y="140" width="268" height="62" rx="8" fill="#f4f7fa" stroke="#d4dee9" />
<g transform="translate(480 159) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g>
<text x="516" y="166" font-size="14" fill="#1a2c44" font-weight="600">Static assets</text>
<text x="516" y="185" font-size="12" fill="#3c4f69">the dashboard app</text>
<rect x="466" y="216" width="268" height="82" rx="8" fill="#f4f7fa" stroke="#d4dee9" />
<g transform="translate(480 239) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></g>
<text x="516" y="242" font-size="14" fill="#1a2c44" font-weight="600">API (/api/*)</text>
<text x="516" y="262" font-size="12" fill="#3c4f69">checks the token from Access,</text>
<text x="516" y="279" font-size="12" fill="#3c4f69">then reads usage when a page opens</text>
<rect x="466" y="356" width="268" height="66" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(480 377) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 15 21.84"/><path d="M21 5V8"/><path d="M21 12L18 17H22L19 22"/><path d="M3 12A9 3 0 0 0 14.59 14.87"/></g>
<text x="516" y="383" font-size="14" fill="#1a2c44" font-weight="600">Cache API</text>
<text x="516" y="402" font-size="12" fill="#3c4f69">keeps answers for a few minutes</text>
<text x="800" y="127" font-size="13" fill="#667691" font-weight="600">Cloudflare APIs</text>
<rect x="800" y="140" width="140" height="106" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(858 152) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
<text x="870" y="198" font-size="14" fill="#1a2c44" font-weight="600" text-anchor="middle">GraphQL</text>
<text x="870" y="215" font-size="14" fill="#1a2c44" font-weight="600" text-anchor="middle">Analytics API</text>
<text x="870" y="235" font-size="12" fill="#3c4f69" text-anchor="middle">usage and metrics</text>
<rect x="800" y="262" width="140" height="92" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(858 274) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
<text x="870" y="320" font-size="14" fill="#1a2c44" font-weight="600" text-anchor="middle">Cloudflare API</text>
<text x="870" y="340" font-size="12" fill="#3c4f69" text-anchor="middle">names of resources</text>
<g transform="translate(806 370) scale(0.6667)" color="#667691" fill="none" stroke="#667691" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></g>
<text x="828" y="382" font-size="12" fill="#667691">read with a</text>
<text x="828" y="398" font-size="12" fill="#667691">read-only API token</text>
