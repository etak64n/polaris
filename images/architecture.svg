<text x="262" y="66" font-size="13" fill="#667691" font-weight="600">Your Cloudflare account</text>
<rect x="32" y="146" width="160" height="112" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(78 162) scale(1.0000)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></g>
